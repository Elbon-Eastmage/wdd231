<body>
    <header>
        <img src="images/logo.webp" alt="honey flower" width="48" height="48">
        <span>Lehi Chamber of Commerce</span>
        <nav>
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="directory.html">Directory</a>
                </li>
                <li>
                    <a class="wayfinder" href="join.html">Join</a>
                </li>
                <li>
                    <a href="#">Discover</a>
                </li>
            </ul>
        </nav>
        <button id="theme-button" class="symbol-button" aria-label="Toggle Dark Mode"></button>
        <button id="hamburger" class="symbol-button" aria-label="Open Navigation Menu"></button>
    </header>
    <main>
        <h1>Join the Chamber</h1>
        <form method="get" action="thankyou.html">
            <label>
                First Name
                <input type="text" name="first-name" id="first-name" autocomplete="given-name" title="Your given name."
                    required>
            </label>
            <label>
                Last Name
                <input type="text" name="last-name" id="last-name" autocomplete="family-name" title="Your family name."
                    required>
            </label>
            <label>
                Organization Title
                <input type="text" name="title" id="title" autocomplete="organization-title"
                    title="The title you have in your company." required pattern="[A-Za-z\s-]{7,}">
            </label>
            <input class="action-button" type="submit" value="Become a Member">
        </form>
    </main>
    <footer>
        <div>
            <p class="emphasize">Lehi Chamber of Commerce</p>
            <p>131 North 100 East<br>Lehi, Utah 84043</p>
            <p>contact@wdd231.net</p>
            <p>385-201-1000</p>
        </div>
        <nav>
            <ul>
                <li>
                    <a href="https://www.youtube.com/@ElbonEastmage" target="_blank">
                        <img src="images/youtube.svg" alt="YouTube Company Page" width="48" height="48">
                    </a>
                </li>
                <li>
                    <a href="https://github.com/Elbon-Eastmage" target="_blank">

                </li>
                <li>
                    <a href="https://www.linkedin.com/in/elbert-eastmond-8450b4399" target="_blank">
                        <img src="images/linkedin.svg" alt="LinkedIn Company Page" width="57" height="48">
                    </a>
                </li>
            </ul>
        </nav>
        <div>
            <p>WDD231 Class Project</p>
            <p>Elbert John Eastmond</p>
            <p><span id="copyright"></span> Lehi Chamber of Commerce</p>

</body>
</html>
